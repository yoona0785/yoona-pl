function splitCsvLine(line){const out=[];let cur='',quoted=false;for(let i=0;i<line.length;i++){const ch=line[i];if(ch==='"'&&line[i+1]==='"'){cur+='"';i++}else if(ch==='"')quoted=!quoted;else if(ch===','&&!quoted){out.push(cur.trim());cur=''}else cur+=ch}out.push(cur.trim());return out}
function parseUserCsv(text,name){const lines=text.replace(/^\ufeff/,'').split(/\r?\n/).filter(x=>x.trim());if(lines.length<2)return toast('模板中没有可导入的数据','error');const heads=splitCsvLine(lines[0]).map(x=>x.replace(/[（(].*?[）)]/g,'')),idx=k=>heads.indexOf(k);if(idx('手机号')<0)return toast('缺少必填字段“手机号”','error');const get=(c,k)=>idx(k)>-1?c[idx(k)]||'':'';importRows=lines.slice(1).map(line=>{const c=splitCsvLine(line);return{phone:get(c,'手机号'),source:get(c,'来源渠道'),channel:get(c,'邀请渠道'),code:get(c,'邀请码'),inviter:get(c,'邀请人'),gender:get(c,'用户性别'),birthday:get(c,'用户生日'),stage:get(c,'当前阶段'),dueDate:get(c,'预产期'),brand:get(c,'偏好品牌'),tagIds:get(c,'用户标签'),groupIds:get(c,'所在群组'),unionId:get(c,'unionId'),wecomId:get(c,'企业微信客户userId')}});validateImportRows(name)}

function validateImportRows(fileName){const registered=new Set(['18100003234','18012343287']),sources=new Set(['邀请码','小程序','推广码','H5活码','后台导入']),codes={YQ139230:'小羊肉串～',YQ139242:'默认会员139242'},tags=new Set(['1001','1008','1012']),groups=new Set(['2001','2005']);importRows=importRows.map((r,i)=>{const errors=[];if(!/^1[3-9]\d{9}$/.test(r.phone))errors.push('错误手机号');else if(registered.has(r.phone))errors.push('已注册手机号');if(r.source&&!sources.has(r.source))errors.push('来源渠道错误');if(r.code&&!codes[r.code])errors.push('邀请码不存在');if(r.code&&codes[r.code]){if(r.inviter)errors.push('填写邀请码后邀请人不可填写');else r.inviter=codes[r.code]}if(r.gender&&!['男','女'].includes(r.gender))errors.push('用户性别错误');if(!validDate(r.birthday))errors.push('用户生日格式错误');if(r.stage&&!['已出生','孕期','备孕'].includes(r.stage))errors.push('当前阶段错误');if(!validDate(r.dueDate))errors.push('预产期格式错误');for(const id of String(r.tagIds||'').split(',').filter(Boolean))if(!tags.has(id.trim()))errors.push(`标签ID ${id} 不存在`);for(const id of String(r.groupIds||'').split(',').filter(Boolean))if(!groups.has(id.trim()))errors.push(`群组ID ${id} 不存在`);return{...r,row:i+2,status:errors.length?errors.join('；'):'可导入'}});showImportResult(fileName)}

ruitForm()"> 长期绑定</label><label><input name="recruitBind" type="radio" value="short" ${settings.bind==='short'?'checked':''} onchange="markRecruitDirty();syncRecruitForm()"> 短期绑定</label></div><div class="binding-short-extra" id="recruitBindExtra"><div class="unit-control"><input id="recruitBindDays" type="number" min="1" max="365" class="control" value="${settings.days}" oninput="markRecruitDirty()"><span>天后自动解除绑定</span></div><div class="inline-note">提示：短期绑定到期后，用户再次通过分销链接访问时可重新建立关系。</div></div></div></div><div class="form-row"><label class="required">结算周期</label><div><div class="unit-control"><span>订单完成后</span><input id="recruitSettleDays" type="number" min="0" max="90" class="control" value="${settings.settle}" oninput="markRecruitDirty()"><span>天结算佣金</span></div><div class="help">结算前发生整单退款时不产生佣金；填写 0 表示订单完成后立即结算。</div></div></div></div></div>`}

function saveDistributorLevel(id=''){const name=levelName.value.trim(),raw=levelThreshold.value.trim(),threshold=Number(raw),current=distributorLevels.find(x=>x.id===id);if(!name)return toast('请输入等级名称','error');if(!raw||!Number.isFinite(threshold)||threshold<0||threshold>99999999.99||!/^\d+(\.\d{1,2})?$/.test(raw))return toast('请输入正确的等级门槛金额，最多两位小数','error');if(distributorLevels.some(x=>x.id!==id&&x.name===name))return toast('等级名称已存在','error');if(distributorLevels.some(x=>x.id!==id&&Number(x.threshold)===threshold))return toast('该销售额门槛已存在','error');const updatedAt=new Date().toLocaleString('zh-CN',{hour12:false}).replaceAll('/','-');if(current){const oldName=current.name;Object.assign(current,{name,threshold,updatedBy:'运营管理员',updatedAt});if(oldName!==name)relations.filter(r=>r.level===oldName).forEach(r=>r.level=name)}else distributorLevels.push({id:'LV'+String(Date.now()).slice(-6),name,threshold,updatedBy:'运营管理员',updatedAt});distributorLevels.sort((a,b)=>a.threshold-b.threshold);save();closeModal();renderContent();toast(current?'等级已更新':'等级已创建')}

function commissionToday(){const d=new Date(),pad=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function commissionRuleStatus(rule){const today=commissionToday();if(rule.invalidatedAt)return '已失效';if(today<rule.start)return '未生效';if(rule.end&&today>rule.end)return '已失效';return '生效中'}
function commissionStatusTag(rule){const status=commissionRuleStatus(rule),cls=status==='生效中'?'success':status==='未生效'?'pending':'muted';return `<span class="tag ${cls}">${status}</span>`}
function commissionRuleActions(rule){const status=commissionRuleStatus(rule);if(status==='未生效')return `<button class="link" onclick="openCommissionEditor('${rule.id}')">编辑</button><button class="link" style="color:#ed4014" onclick="deleteCommissionRule('${rule.id}')">删除</button><button class="link" onclick="showCommissionLogs('${rule.id}')">日志</button>`;if(status==='生效中')return `<button class="link" onclick="openCommissionEditor('${rule.id}')">编辑</button><button class="link" onclick="expireCommissionRule('${rule.id}')">立即失效</button><button class="link" onclick="copyCommissionRule('${rule.id}')">复制</button><button class="link" onclick="showCommissionLogs('${rule.id}')">日志</button>`;return `<button class="link" onclick="copyCommissionRule('${rule.id}')">复制</button><button class="link" style="color:#ed4014" onclick="deleteCommissionRule('${rule.id}')">删除</button><button class="link" onclick="showCommissionLogs('${rule.id}')">日志</button>`}
function commissionRulePanel(){
 const rows=commissionRules.filter(r=>(!state.commissionNameFilter||r.name.toLowerCase().includes(state.commissionNameFilter.toLowerCase()))&&(!state.commissionModeFilter||r.mode===state.commissionModeFilter)),period=r=>`${r.start||'-'}${r.end?' 至 '+r.end:' 起长期生效'}`,groups=r=>r.groups.map(id=>productGroups.find(g=>g.id===id)?.name||id),rates=r=>r.levelRates.map(rate=>{const level=distributorLevels.find(x=>x.id===rate.levelId),unit=r.mode==='比例佣金'?'%':'元';return `<span>${esc(level?.name||rate.levelId)}：团长 ${rate.leader}${unit} / 团员 ${rate.member}${unit}</span>`}).join('')||'<span class="subline">未设置</span>';
 return `<div class="toolbar rule-list-toolbar"><div class="search-row"><label>规则名称 <input id="commissionRuleKw" class="input" value="${esc(state.commissionNameFilter)}" placeholder="请输入规则名称"></label><label>佣金模式 <select id="commissionRuleMode" class="select"><option value="">全部</option><option value="比例佣金" ${state.commissionModeFilter==='比例佣金'?'selected':''}>比例佣金</option><option value="固定佣金" ${state.commissionModeFilter==='固定佣金'?'selected':''}>固定佣金</option></select></label><button class="search-icon" onclick="filterCommissionRules()">⌕</button><button class="link" onclick="clearCommissionRules()">清空</button><div class="actions"><button class="btn primary" onclick="openCommissionEditor()">⊕ 新增佣金规则</button></div></div></div><div class="table-card"><table style="min-width:1450px"><thead><tr><th style="width:14%">规则名称</th><th style="width:11%">生效时间</th><th style="width:8%">佣金模式</th><th style="width:12%">适用商品组</th><th style="width:18%">团长等级 / 佣金</th><th style="width:10%">创建时间</th><th style="width:10%">更新时间</th><th style="width:8%">状态</th><th style="width:9%">操作</th></tr></thead><tbody>${rows.map(r=>`<tr><td><span class="primary-text" onclick="openCommissionEditor('${r.id}')">${esc(r.name)}</span><div class="subline">ID：${esc(r.id)}</div></td><td>${period(r)}</td><td><span class="tag ${r.mode==='比例佣金'?'type-tag':'muted'}">${esc(r.mode)}</span></td><td><div class="commission-group-tags">${groups(r).map(name=>`<span class="tag level-tag">${esc(name)}</span>`).join('')||'-'}</div></td><td><div class="commission-rate-summary">${rates(r)}</div></td><td>${operatorTime(r.createdBy,r.created)}</td><td>${operatorTime(r.updatedBy,r.updated)}</td><td>${commissionStatusTag(r)}</td><td><div class="ops">${commissionRuleActions(r)}</div></td></tr>`).join('')||'<tr><td class="empty-row" colspan="9">暂无匹配佣金规则</td></tr>'}</tbody></table><div class="pager"><span></span>${standardRulePager(rows.length)}</div></div>`

function commissionPeriodsOverlap(startA,endA,startB,endB){const max='9999-12-31';return startA<=(endB||max)&&startB<=(endA||max)}
function validateCommissionGroupPeriod(id,groups,start,end){const conflict=commissionRules.find(rule=>rule.id!==id&&!rule.invalidatedAt&&rule.groups.some(groupId=>groups.includes(groupId))&&commissionPeriodsOverlap(start,end,rule.start,rule.end));if(!conflict)return null;const groupId=conflict.groups.find(groupId=>groups.includes(groupId)),group=productGroups.find(g=>g.id===groupId);return `商品组“${group?.name||groupId}”在该时段已关联佣金规则“${conflict.name}”`}
function saveCommissionStandalone(id=''){const name=document.getElementById('commissionName').value.trim(),start=document.getElementById('commissionStart').value,end=document.getElementById('commissionEnd').value,mode=document.querySelector('input[name=commissionMode]:checked')?.value,old=commissionRules.find(r=>r.id===id),groups=[...document.querySelectorAll('.commission-group-check:checked')].map(x=>x.value);if(!name)return toast('请输入规则名称','error');if(commissionRules.some(r=>r.id!==id&&r.name===name))return toast('规则名称不可重复','error');if(!start)return toast('请选择生效开始时间','error');if(old&&start!==old.start)return toast('佣金规则新建后不可修改生效开始时间','error');if(end&&end<start)return toast('结束时间不能早于开始时间','error');if(!groups.length)return toast('请选择商品组','error');const conflict=validateCommissionGroupPeriod(id,groups,start,end);if(conflict)return toast(conflict,'error');const rates=[];for(const row of document.querySelectorAll('.commission-editor-table tbody tr')){const a=row.querySelector('.commission-leader').value.trim(),b=row.querySelector('.commission-member').value.trim(),leader=Number(a),member=Number(b);if(a===''||b===''||!Number.isFinite(leader)||!Number.isFinite(member)||leader<0||member<0)return toast('请完善各团长等级的佣金','error');if(!/^\d+(\.\d{1,2})?$/.test(a)||!/^\d+(\.\d{1,2})?$/.test(b))return toast('佣金最多保留两位小数','error');if(mode==='比例佣金'&&(leader>100||member>100))return toast('比例佣金需在 0～100% 之间','error');rates.push({levelId:row.dataset.levelId,leader,member})}const time=nowText(),next={id:id||`CR${String(Date.now()).slice(-6)}`,name,start,end:end||'',mode,groups,levelRates:rates,created:old?.created||time,createdBy:old?.createdBy||'运营管理员',updated:time,updatedBy:'运营管理员',invalidatedAt:old?.invalidatedAt||''};if(old)commissionRules.splice(commissionRules.findIndex(x=>x.id===id),1,next);else commissionRules.unshift(next);state.commissionCopySource='';save();cancelCommissionEdit();toast(id?'佣金规则已更新':'佣金规则已新建')}
