<body>
<div class="workbench" id="workbench">
  <aside class="logic-rail" id="logicRail"><span>展开逻辑</span></aside>
  <aside class="logic-panel">
    <div class="logic-head"><span>品牌租户 3.0 业务逻辑</span><div class="logic-actions"><label class="text-btn" for="logicFile">同步本地文档</label><input id="logicFile" type="file" accept=".md,.markdown,.txt" hidden><button class="text-btn" id="collapseLogic">收起逻辑</button></div></div>
    <div class="logic-source" id="logicSource">来源：xx需求文档.md</div>
    <div class="logic-doc" id="logicDoc"></div>
  </aside>
  <main class="preview">
    <header class="topbar">
      <div class="logo">私域运营平台</div>
      <button class="side-toggle" id="sideToggle" aria-label="折叠菜单"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M2 3h10M2 7h10M2 11h10" stroke="#666" fill="none"/></svg></button>
      <div class="tabs" id="tabs"></div>
      <div class="top-right"><span>平台管理</span><div class="avatar">管</div><span>⌄</span></div>
    </header>
    <div class="app-body">
      <aside class="sidebar" id="sidebar">
        <input class="menu-search" id="menuSearch" placeholder="搜索菜单">
        <div id="menuRoot"></div><div class="menu-empty hidden" id="menuEmpty">暂无匹配报表</div>
      </aside>
      <section class="canvas-wrap"><div class="canvas" id="canvas"></div></section>
    </div>
  </main>
</div>
<div class="toast-stack" id="toastStack"></div>

function renderTrade(type,title){const isAfter=type==='aftersales',data=state[type];shell(`<div class="list-tools"><div class="field-inline"><label>关键词</label><input class="input" id="tradeKw" placeholder="${isAfter?'售后单号/订单号':'订单号/商品名称'}"></div><div class="field-inline"><label>发货平台</label><select class="select" id="tradePlatform"><option value="">全部</option>${state.tenants.filter(x=>x.mode==='独立租户').map(x=>`<option>${x.name}</option>`).join('')}</select></div><button class="btn search-btn" id="tradeSearch"><svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/></svg></button><button class="link" id="tradeClear">清空</button><span class="tools-spacer"></span><button class="btn" id="tradeExport">⇧ 导出</button>${!isAfter?'<button class="btn">商品导出</button>':''}</div><div class="table-wrap"><table class="table"><thead><tr><th>${isAfter?'售后单/商品':'订单/商品'}</th><th>单价</th><th>数量</th><th>${isAfter?'实际退款':'优惠'}</th><th>${isAfter?'售后状态':'订单状态'}</th><th>用户</th><th>发货平台</th><th>创建时间</th><th>操作</th></tr></thead><tbody id="tradeBody"></tbody></table></div><div class="pagination"><span id="tradeCount"></span><div class="pages"><button class="page-btn active">1</button><button class="page-btn">2</button><select class="select"><option>20 条/页</option></select></div></div>`);let filtered=[];const draw=()=>{const kw=tradeKw.value.trim(),p=tradePlatform.value;filtered=data.filter(x=>(!kw||x.id.includes(kw)||x.product.includes(kw)||(x.order||'').includes(kw))&&(!p||x.platform===p));tradeBody.innerHTML=filtered.map(x=>`<tr><td><div><button class="link">${x.id}</button>${isAfter?`<span class="subtext">订单：${x.order}</span>`:''}<div class="product-cell" style="margin-top:8px"><div class="thumb">商品</div><span>${esc(x.product)}</span></div></div></td><td>￥${Number(x.amount).toFixed(2)}</td><td>${x.qty}</td><td>${isAfter?'￥'+Number(x.amount).toFixed(2):'-'}</td><td><span class="tag ${x.status.includes('待')?'warn':x.status.includes('退')?'blue':''}">${x.status}</span></td><td>用户ID：${x.user}</td><td><span class="tag blue">${esc(x.platform)}</span></td><td>${x.created}</td><td><button class="link">详情</button>${isAfter?'　<button class="link">同步</button>':''}</td></tr>`).join('')||`<tr><td colspan="9"><div class="empty">暂无匹配记录</div></td></tr>`;tradeCount.textContent=`共 ${filtered.length} 条`};tradeSearch.onclick=draw;tradeClear.onclick=()=>{tradeKw.value='';tradePlatform.value='';draw()};tradeExport.onclick=()=>exportCSV(title,filtered,['id','product','amount','qty','status','user','platform','created']);draw()}
function exportCSV(name,rows,fields){if(name==='用户数据'){rows=rows.map(r=>({'用户昵称':r.nickname,'用户ID':r.id,'注册手机号':r.phone,'注册时间':r.registered,'来源渠道':r.source,'邀请渠道':r.inviteChannel,'邀请人Id':r.inviter,'邀请人':r.inviter==='-'?'-':`默认会员${r.inviter}`,'未使用积分':r.points,'已使用积分':680,'用户性别':r.gender,'用户生日':r.birthday,'当前阶段':r.stage,'预产期':r.stage==='孕期'?'2026-09-21':'-','偏好品牌':r.platform,'用户标签':r.tag,'所在群组':r.group,'unionId':`ok${r.id}NQPOpSF`,'openId':`orgt${r.id}XIOR`,'宝宝信息':r.babyName==='-'?'-':`${r.babyName}/${r.babyBirth}/${r.babyGender}`,'企业微信客户userId':r.qyid,'接入平台':r.platform,'one ID':r.oneid}));fields=['用户昵称','用户ID','注册手机号','注册时间','来源渠道','邀请渠道','邀请人Id','邀请人','未使用积分','已使用积分','用户性别','用户生日','当前阶段','预产期','偏好品牌','用户标签','所在群组','unionId','openId','宝宝信息','企业微信客户userId','接入平台','one ID']}const csv='\ufeff'+fields.join(',')+'\n'+rows.map(r=>fields.map(f=>`"${String(r[f]??'').replace(/"/g,'""')}"`).join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=`${name}_${Date.now()}.csv`;a.click();URL.revokeObjectURL(a.href);toast('导出文件已生成')}
